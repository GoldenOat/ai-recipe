spring:
  application:
    name: ring-offline-notification
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ring_offline}
    username: ${SPRING_DATASOURCE_USERNAME:ring}
    password: ${SPRING_DATASOURCE_PASSWORD:ring}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:ring-offline-notification}
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

ring:
  offline:
    threshold-seconds: ${RING_OFFLINE_THRESHOLD_SECONDS:10}
    sweep-interval-ms: ${RING_OFFLINE_SWEEP_INTERVAL_MS:60000}
  redis:
    presence-key-prefix: ${RING_REDIS_PRESENCE_KEY_PREFIX:presence:}
    offline-timer-key-prefix: ${RING_REDIS_OFFLINE_TIMER_KEY_PREFIX:offline-timer:}
  kafka:
    mock-enabled: ${RING_KAFKA_MOCK_ENABLED:true}
    topics:
      heartbeats: ${RING_KAFKA_TOPIC_HEARTBEATS:device.heartbeats}
      status-changes: ${RING_KAFKA_TOPIC_STATUS_CHANGES:device.status-changes}
  notification:
    console-enabled: ${RING_NOTIFICATION_CONSOLE_ENABLED:true}
